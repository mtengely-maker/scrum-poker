<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker Pro</title>
    <style>
        :root { --primary: #6366f1; --primary-hover: #4f46e5; --bg: #0f172a; --panel: #1e293b; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; }
        .sidebar { width: 220px; background: var(--panel); padding: 15px; border-right: 1px solid #334155; overflow-y: auto; font-size: 13px; }
        .container { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; }
        
        .btn { padding: 10px 16px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: #e11d48; }

        .table-area { flex-grow: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        .table-shape { width: 350px; height: 200px; background: #065f46; border-radius: 100px; border: 4px solid #047857; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        
        .seat { position: absolute; display: flex; flex-direction: column; align-items: center; }
        .avatar { width: 45px; height: 45px; background: #334155; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--primary); }
        .seat-name { font-size: 11px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px; margin-top: 4px; }
        
        .card { width: 50px; height: 70px; background: var(--panel); border: 2px solid #475569; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .card.selected { border-color: var(--primary); background: #312e81; }
        
        .task-item { margin-bottom: 8px; padding: 8px; border-radius: 6px; background: #334155; }
        .task-item.active { border-left: 4px solid var(--primary); }
    </style>
</head>
<body>
    <div class="sidebar">
        <strong>Előzmények</strong>
        <div id="history-list" style="margin-top:10px;"></div>
    </div>
    <div class="container">
        <div id="login-screen">
            <input type="text" id="username" placeholder="Neved..." style="padding:10px; border-radius:8px; border:none; width:200px;">
            <button class="btn" onclick="join()">Belépés</button>
        </div>
        <div id="game-screen" style="display:none; flex-direction:column; height:100%;">
            <div id="sm-panel" style="display:none; gap:10px; margin-bottom:20px;">
                <textarea id="tasks" rows="1" placeholder="Feladatok (újsorral)..." style="flex-grow:1; padding:10px; border-radius:8px;"></textarea>
                <button class="btn" onclick="start()">Indítás</button>
                <button class="btn btn-danger" onclick="reset()">Reset</button>
            </div>
            
            <div class="table-area" id="table">
                <div class="table-shape" id="task-display">Várakozás...</div>
            </div>

            <div style="display:flex; justify-content:center; gap:10px; margin-top:10px;" id="cards"></div>
            <button class="btn" onclick="reveal()" style="margin: 20px auto; width: 200px;">Szavazatok felfedése</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function join() { const n = document.getElementById('username').value; if(n) { socket.emit('join', n); document.getElementById('login-screen').style.display='none'; document.getElementById('game-screen').style.display='flex'; } }
        
        ['1','2','3','5','8','13','21','?'].forEach(v => {
            const d = document.createElement('div'); d.className='card'; d.innerText=v;
            d.onclick = () => { document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected')); d.classList.add('selected'); socket.emit('vote', v); };
            document.getElementById('cards').appendChild(d);
        });

        function start() { socket.emit('addTasks', document.getElementById('tasks').value.split('\n')); }
        function reveal() { socket.emit('reveal'); }
        function reset() { socket.emit('resetGame'); }

        socket.on('state', (s) => {
            if(s.players[socket.id]?.isSM) document.getElementById('sm-panel').style.display = 'flex';
            
            // Feladatlista átlaggal
            const list = document.getElementById('history-list'); list.innerHTML = '';
            s.tasks.forEach((t, i) => {
                let avg = "";
                if (i < s.currentTaskIndex && s.taskResults[i]) {
                    const votes = Object.values(s.taskResults[i]).filter(v => !isNaN(v));
                    if (votes.length > 0) avg = ` (Átlag: ${(votes.reduce((a,b)=>a+parseInt(b),0)/votes.length).toFixed(1)})`;
                }
                const div = document.createElement('div');
                div.className = `task-item ${i === s.currentTaskIndex ? 'active' : ''}`;
                div.innerText = `${i+1}. ${t}${avg}`;
                list.appendChild(div);
            });

            if(s.tasks.length > 0) document.getElementById('task-display').innerText = s.tasks[s.currentTaskIndex];
            
            const table = document.getElementById('table');
            document.querySelectorAll('.seat').forEach(x => x.remove());
            const players = Object.values(s.players);
            players.forEach((p, i) => {
                const angle = (i / players.length) * 2 * Math.PI;
                const seat = document.createElement('div'); seat.className = 'seat';
                seat.style.transform = `translate(${Math.cos(angle)*160}px, ${Math.sin(angle)*100}px)`;
                seat.innerHTML = `<div class="avatar">${p.vote ? (s.revealed ? p.vote : '✔') : '...'}</div><div class="seat-name">${p.name}</div>`;
                table.appendChild(seat);
            });
        });
    </script>
</body>
</html>
