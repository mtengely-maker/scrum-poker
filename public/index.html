<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker</title>
    <style>
        body { margin: 0; padding: 10px; background: #0f172a; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex-grow: 1; }
        h1 { font-size: 1.2rem; text-align: center; margin: 5px 0; color: #818cf8; }
        #game-screen { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .poker-table { flex-grow: 1; background: #065f46; border-radius: 50px; position: relative; margin: 10px 0; min-height: 150px; }
        .cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
        .poker-card { aspect-ratio: 4/5; background: #1e293b; border: 1px solid #334155; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .poker-card.selected { background: #4f46e5; }
        input, button { padding: 10px; border-radius: 5px; border: none; margin-top: 5px; width: 100%; }
        button { background: #4f46e5; color: white; cursor: pointer; }
        .player-seat { position: absolute; display: flex; flex-direction: column; align-items: center; font-size: 9px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Scrum Poker</h1>
        <div id="login-screen">
            <input type="text" id="username-input" placeholder="Neved...">
            <button id="login-btn">Belépés</button>
        </div>
        <div id="game-screen" style="display:none;">
            <div id="sm-panel" style="display:none;">
                <textarea id="tasks-input" rows="1" placeholder="Feladatok (soronként)..."></textarea>
                <button id="start-btn">Indítás</button>
            </div>
            <div class="poker-table" id="poker-table"></div>
            <div id="cards-container" class="cards-grid"></div>
            <div id="actions" style="margin-top:10px;">
                <button id="reveal-btn" style="background:#059669; display:none;">Felfedés</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        document.getElementById('login-btn').onclick = () => {
            const name = document.getElementById('username-input').value;
            if (!name) return;
            socket.emit('join', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
        };

        const container = document.getElementById('cards-container');
        ['1', '2', '3', '5', '8', '13', '21', '?', '☕'].forEach(v => {
            const d = document.createElement('div');
            d.className = 'poker-card'; d.innerText = v;
            d.onclick = () => {
                document.querySelectorAll('.poker-card').forEach(c => c.classList.remove('selected'));
                d.classList.add('selected');
                socket.emit('vote', v);
            };
            container.appendChild(d);
        });

        document.getElementById('start-btn').onclick = () => socket.emit('addTasks', document.getElementById('tasks-input').value.split('\n'));
        document.getElementById('reveal-btn').onclick = () => socket.emit('reveal');

        socket.on('state', (s) => {
            if(s.players[socket.id]?.isSM) document.getElementById('sm-panel').style.display = 'block';
            if(s.tasks.length > 0) document.getElementById('reveal-btn').style.display = 'block';
            
            const table = document.getElementById('poker-table');
            table.innerHTML = '';
            Object.values(s.players).forEach((p, i) => {
                const seat = document.createElement('div');
                seat.className = 'player-seat';
                seat.style.left = `${10 + (i * 20)}%`; seat.style.top = '30%';
                seat.innerHTML = `<div>${p.vote ? (s.revealed ? p.vote : '✅') : '⏳'}</div><div class="player-name">${p.name}</div>`;
                table.appendChild(seat);
            });
        });
    </script>
</body>
</html>
