<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; }
        .cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
        .poker-card { aspect-ratio: 3/4; border: 2px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; }
        .poker-card.selected { background: var(--primary); color: white; border-color: var(--primary); }
        .player-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Scrum Poker</h1>
        <div id="login-screen">
            <input type="text" id="username-input" placeholder="Neved...">
            <button onclick="joinGame()">Belépés</button>
        </div>
        <div id="game-screen" style="display:none;">
            <div id="sm-panel" style="display:none;">
                <textarea id="tasks-input" rows="3" placeholder="Ide írd a feladatokat..."></textarea>
                <button onclick="saveTasks()">Feladatok indítása</button>
                <button onclick="resetGame()" style="background:red;">Új játék</button>
            </div>
            <div id="current-task-display" style="display:none;">
                <h3 id="task-title">Feladat: -</h3>
                <div class="cards-grid" id="cards-container"></div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button id="reveal-btn" onclick="revealVotes()">Felfedés</button>
                    <button id="next-btn" onclick="nextTask()">Következő</button>
                </div>
            </div>
            <h3>Résztvevők:</h3>
            <div id="players-container"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function joinGame() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert('Add meg a neved!');
            socket.emit('join', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
        }

        // Kártyák építése
        const container = document.getElementById('cards-container');
        ['0', '1', '2', '3', '5', '8', '13', '21', '?', '☕'].forEach(val => {
            const div = document.createElement('div');
            div.className = 'poker-card';
            div.innerText = val;
            div.onclick = () => {
                document.querySelectorAll('.poker-card').forEach(c => c.classList.remove('selected'));
                div.classList.add('selected');
                socket.emit('vote', val);
            };
            container.appendChild(div);
        });

        function saveTasks() { socket.emit('addTasks', document.getElementById('tasks-input').value.split('\n')); }
        function revealVotes() { socket.emit('reveal'); }
        function nextTask() { socket.emit('nextTask'); }
        function resetGame() { socket.emit('resetGame'); }

        socket.on('state', (state) => {
            const me = state.players[socket.id];
            if (!me) return;
            
            if (me.isSM) document.getElementById('sm-panel').style.display = 'block';
            
            const taskDisplay = document.getElementById('current-task-display');
            if (state.tasks.length > 0 && state.currentTaskIndex < state.tasks.length) {
                taskDisplay.style.display = 'block';
                document.getElementById('task-title').innerText = state.tasks[state.currentTaskIndex];
                if (me.isSM) {
                    document.getElementById('reveal-btn').style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
            
            const pContainer = document.getElementById('players-container');
            pContainer.innerHTML = '';
            for (let id in state.players) {
                const p = state.players[id];
                pContainer.innerHTML += `<div class="player-item"><span>${p.name}</span><span>${(state.revealed && p.vote !== null) ? '<b>'+p.vote+'</b>' : (p.vote ? '✅' : '⏳')}</span></div>`;
            }
        });
    </script>
</body>
</html>
