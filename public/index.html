<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker Pro</title>
    <style>
        :root { --primary: #6366f1; --primary-hover: #4f46e5; --bg: #0f172a; --panel: #1e293b; --table: #065f46; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: row; }
        
        .sidebar { width: 240px; background: var(--panel); padding: 15px; border-right: 1px solid #334155; overflow-y: auto; flex-shrink: 0; height: 100vh; box-sizing: border-box; }
        .container { flex-grow: 1; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100vh; box-sizing: border-box; overflow-y: auto; }
        
        .controls { background: var(--panel); padding: 10px; border-radius: 10px; width: 100%; max-width: 500px; text-align: center; }
        
        .table-area { flex-grow: 1; position: relative; width: 100%; min-height: 200px; display: flex; justify-content: center; align-items: center; }
        .table-shape { width: 300px; height: 160px; background: var(--table); border-radius: 100px; border: 4px solid #047857; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); z-index: 1; }
        
        .seat { position: absolute; display: flex; flex-direction: column; align-items: center; transition: 0.3s; z-index: 2; }
        .avatar { width: 40px; height: 40px; background: #334155; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 2px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .seat-name { font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; margin-top: 2px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .cards-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 600px; }
        .card { width: 42px; height: 58px; background: #334155; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 14px; border: 2px solid transparent; transition: 0.1s; }
        .card.selected { border-color: var(--primary); background: #312e81; transform: translateY(-4px); }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: #e11d48; }
        
        .task-item { padding: 6px 10px; margin-bottom: 6px; background: #334155; border-radius: 4px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .task-item:hover { background: #475569; }
        .task-item.active { border-left: 4px solid var(--primary); background: #1e293b; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: 100vh; overflow: hidden; }
            .sidebar { width: 100%; height: 130px; border-right: none; border-bottom: 1px solid #334155; flex-shrink: 0; }
            .container { height: calc(100vh - 130px); }
            .table-shape { width: 240px; height: 130px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <strong>Előzmények</strong>
        <div style="font-size:11px; color:#94a3b8; margin-bottom:8px;">Kattints a váltáshoz</div>
        <div id="history-list" style="margin-top:5px;"></div>
    </div>
    
    <div class="container">
        <div id="login-screen" style="margin: auto; text-align: center; padding: 20px;">
            <h2>Csatlakozás</h2>
            <input type="text" id="username" placeholder="Neved..." style="padding:10px; border-radius:6px; border:none; margin-bottom:10px; width:200px;"><br>
            <button class="btn" onclick="join()">Belépés</button>
        </div>

        <div id="game-screen" style="display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:space-between;">
            <!-- Scrum Master Panel (Feladatok + Skála + Indítás + Reset) -->
            <div id="sm-panel" class="controls" style="display:none; margin-bottom: 5px;">
                <textarea id="tasks" rows="2" placeholder="Feladatok (soronként)..." style="width:90%; padding:6px; border-radius:6px; resize:none;"></textarea>
                <div style="margin-top:5px; display:flex; justify-content:center; align-items:center; gap:10px; font-size: 13px;">
                    <label>Skála:</label>
                    <select id="deck-select" style="padding:4px; border-radius:4px; background:#334155; color:white; border:none;">
                        <option value="fibonacci">Fibonacci (1..21)</option>
                        <option value="extended">Kiterjesztett (0..100)</option>
                        <option value="tshirt">T-Shirt (XS..XXL)</option>
                    </select>
                </div>
                <div style="margin-top:5px; display:flex; justify-content:center; gap:10px;">
                    <button class="btn" onclick="start()" style="padding:5px 10px; font-size:12px;">Indítás</button>
                    <button class="btn btn-danger" onclick="resetGame()" style="padding:5px 10px; font-size:12px;">Reset</button>
                </div>
            </div>
            
            <div class="table-area" id="table-area">
                <div class="table-shape">
                    <div id="task-title" style="color: #cbd5e1; font-size: 13px; font-weight: bold; padding: 0 10px;">Várakozás...</div>
                    <div id="avg-display" style="font-size: 2.2rem; font-weight: bold; color: #818cf8; margin-top: 4px;"></div>
                </div>
            </div>

            <!-- Kártyák és Vezérlők -->
            <div style="width:100%; text-align:center; background: var(--panel); padding: 10px; border-radius: 10px; margin-top: 10px;">
                <div id="cards" class="cards-container" style="margin-bottom: 8px;"></div>
                <!-- Csak a Scrum Master látja a Felfedés és Következő gombokat -->
                <div id="sm-controls" style="display:none; justify-content:center; gap:10px;">
                    <button class="btn" onclick="socket.emit('reveal')" style="background:#059669;">Felfedés</button>
                    <button class="btn" onclick="socket.emit('nextTask')">Következő ➡</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const decks = {
            fibonacci: ['1', '2', '3', '5', '8', '13', '21', '?', '☕'],
            extended: ['0', '0.5', '1', '2', '3', '5', '8', '13', '20', '40', '100', '?', '☕'],
            tshirt: ['XS', 'S', 'M', 'L', 'XL', 'XXL', '?', '☕']
        };

        function join() { 
            const name = document.getElementById('username').value.trim();
            if(name) { 
                socket.emit('join', name); 
                document.getElementById('login-screen').style.display = 'none'; 
                document.getElementById('game-screen').style.display = 'flex'; 
            } 
        }
        function start() { 
            const tasksText = document.getElementById('tasks').value;
            const deckType = document.getElementById('deck-select').value;
            if(tasksText) socket.emit('addTasks', { tasks: tasksText.split('\n'), deckType }); 
        }
        function resetGame() { socket.emit('resetGame'); }
        
        function renderCards(deckType) {
            const container = document.getElementById('cards');
            container.innerHTML = '';
            const deck = decks[deckType] || decks.fibonacci;
            deck.forEach(v => {
                const d = document.createElement('div'); d.className = 'card'; d.innerText = v;
                d.onclick = () => {
                    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                    d.classList.add('selected');
                    socket.emit('vote', v);
                };
                container.appendChild(d);
            });
        }

        function getClosestValue(vals, deckType) {
            const deck = decks[deckType] || decks.fibonacci;
            const numericDeck = deck.map(v => parseFloat(v)).filter(v => !isNaN(v));

            if (numericDeck.length === 0) {
                const counts = {};
                vals.forEach(v => counts[v] = (counts[v] || 0) + 1);
                let maxVal = vals[0];
                let maxCount = 0;
                for(let v in counts) {
                    if(counts[v] > maxCount) {
                        maxCount = counts[v];
                        maxVal = v;
                    }
                }
                return maxVal;
            }

            const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
            let closest = numericDeck[0];
            let minDiff = Math.abs(avg - closest);
            for(let i = 1; i < numericDeck.length; i++) {
                let diff = Math.abs(avg - numericDeck[i]);
                if(diff < minDiff) {
                    minDiff = diff;
                    closest = numericDeck[i];
                }
            }
            return closest;
        }

        socket.on('state', (s) => {
            const isSM = s.players[socket.id]?.isSM;
            
            // Panel megjelenítések SM jog alapján
            document.getElementById('sm-panel').style.display = isSM ? 'block' : 'none';
            document.getElementById('sm-controls').style.display = isSM ? 'flex' : 'none';

            renderCards(s.cardDeckType || 'fibonacci');
            document.getElementById('task-title').innerText = s.tasks[s.currentTaskIndex] ? s.tasks[s.currentTaskIndex] : "Nincs aktív feladat";
            
            if(s.revealed && s.taskResults[s.currentTaskIndex]) {
                const rawVotes = s.taskResults[s.currentTaskIndex].filter(v => v !== null && v !== undefined);
                const numericVals = rawVotes.filter(v => !isNaN(v)).map(v => parseFloat(v));
                
                if(numericVals.length > 0) {
                    const recommended = getClosestValue(numericVals, s.cardDeckType);
                    document.getElementById('avg-display').innerText = recommended;
                } else if(rawVotes.length > 0) {
                    const recommended = getClosestValue(rawVotes, s.cardDeckType);
                    document.getElementById('avg-display').innerText = recommended;
                } else {
                    document.getElementById('avg-display').innerText = "-";
                }
            } else { 
                document.getElementById('avg-display').innerText = ""; 
            }

            const tableArea = document.getElementById('table-area');
            document.querySelectorAll('.seat').forEach(el => el.remove());
            
            const players = Object.values(s.players);
            players.forEach((p, i) => {
                const angle = (i / players.length) * 2 * Math.PI - Math.PI / 2;
                const radiusX = 130;
                const radiusY = 75;
                const x = Math.cos(angle) * radiusX;
                const y = Math.sin(angle) * radiusY;

                let voteContent = p.vote ? (s.revealed ? p.vote : '✅') : '⏳';

                const seat = document.createElement('div');
                seat.className = 'seat';
                seat.style.transform = `translate(${x}px, ${y}px)`;
                seat.innerHTML = `
                    <div class="avatar" title="${p.name}">${p.emoji || '👤'}</div>
                    <div class="seat-name">${p.name}</div>
                    <div style="font-size:10px; color:#cbd5e1; background:rgba(0,0,0,0.6); padding:1px 5px; border-radius:3px; margin-top:2px;">${voteContent}</div>
                `;
                tableArea.appendChild(seat);
            });

            const list = document.getElementById('history-list'); 
            list.innerHTML = '';
            s.tasks.forEach((t, i) => {
                let resText = "";
                if(s.taskResults[i]) {
                    const rawVotes = s.taskResults[i].filter(v => v !== null && v !== undefined);
                    const numericVals = rawVotes.filter(v => !isNaN(v)).map(v => parseFloat(v));
                    
                    if(numericVals.length > 0) {
                        const rec = getClosestValue(numericVals, s.cardDeckType);
                        resText = ` [${rec}]`;
                    } else if(rawVotes.length > 0) {
                        const rec = getClosestValue(rawVotes, s.cardDeckType);
                        resText = ` [${rec}]`;
                    }
                }
                const div = document.createElement('div');
                div.className = `task-item ${i === s.currentTaskIndex ? 'active' : ''}`;
                div.innerText = `${i+1}. ${t.trim()}${resText}`;
                
                // Ha az előzményre kattintanak, csak az SM tudjon navigálni (vagy bárki, ha úgy tetszik - itt most az SM-re vagy bárkire hagytuk, de az SM irányít)
                div.onclick = () => {
                    if(isSM) socket.emit('goToTask', i);
                };
                list.appendChild(div);
            });
        });
    </script>
</body>
</html>
