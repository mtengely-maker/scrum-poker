<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker Pro</title>
    <style>
        :root { --primary: #6366f1; --primary-hover: #4f46e5; --bg: #0f172a; --panel: #1e293b; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; }
        .sidebar { width: 240px; background: var(--panel); padding: 15px; border-right: 1px solid #334155; overflow-y: auto; }
        .container { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .controls { background: var(--panel); padding: 15px; border-radius: 10px; width: 100%; max-width: 500px; margin-bottom: 10px; }
        .card { width: 50px; height: 65px; background: #334155; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px; margin: 4px; font-weight: bold; border: 2px solid transparent; }
        .card.selected { border-color: var(--primary); background: #312e81; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; }
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: #e11d48; }
        .task-item { padding: 6px 10px; margin-bottom: 6px; background: #334155; border-radius: 4px; font-size: 13px; }
        .task-item.active { border-left: 3px solid var(--primary); background: #1e293b; }
    </style>
</head>
<body>
    <div class="sidebar">
        <strong>Előzmények</strong>
        <div id="history-list" style="margin-top:10px;"></div>
    </div>
    
    <div class="container">
        <div id="login-screen" style="margin: auto; text-align: center;">
            <h2>Csatlakozás</h2>
            <input type="text" id="username" placeholder="Neved..." style="padding:10px; border-radius:6px; border:none; margin-bottom:10px; width:200px;"><br>
            <button class="btn" onclick="join()">Belépés</button>
        </div>

        <div id="game-screen" style="display:none; width:100%; height:100%; flex-direction:column; align-items:center;">
            <div id="sm-panel" class="controls" style="display:none; text-align:center;">
                <textarea id="tasks" rows="2" placeholder="Feladatok (soronként adhatod meg)..." style="width:90%; padding:8px; border-radius:6px; resize:none;"></textarea><br>
                <div style="margin-top:8px; display:flex; justify-content:center; gap:10px;">
                    <button class="btn" onclick="start()">Feladatok indítása</button>
                    <button class="btn btn-danger" onclick="resetGame()">Reset</button>
                </div>
            </div>
            
            <div style="text-align:center; margin: auto;">
                <h3 id="task-title" style="color: #94a3b8; margin-bottom: 5px;">Várakozás a feladatokra...</h3>
                <div id="avg-display" style="font-size: 4rem; font-weight: bold; color: var(--primary);"></div>
            </div>

            <div style="width:100%; text-align:center;">
                <div id="cards" style="margin-bottom: 15px;"></div>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <button class="btn" onclick="socket.emit('reveal')" style="background:#059669;">Felfedés</button>
                    <button class="btn" onclick="socket.emit('nextTask')">Következő feladat ➡</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        function join() { 
            const name = document.getElementById('username').value.trim();
            if(name) { socket.emit('join', name); document.getElementById('login-screen').style.display='none'; document.getElementById('game-screen').style.display='flex'; } 
        }
        function start() { 
            const tasksText = document.getElementById('tasks').value;
            if(tasksText) socket.emit('addTasks', tasksText.split('\n')); 
        }
        function resetGame() { socket.emit('resetGame'); }
        
        ['1','2','3','5','8','13','21','?'].forEach(v => {
            const d = document.createElement('div'); d.className='card'; d.innerText=v;
            d.onclick = () => {
                document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
                d.classList.add('selected');
                socket.emit('vote', v);
            };
            document.getElementById('cards').appendChild(d);
        });

        socket.on('state', (s) => {
            if(s.players[socket.id]?.isSM) document.getElementById('sm-panel').style.display = 'block';
            else document.getElementById('sm-panel').style.display = 'none';

            document.getElementById('task-title').innerText = s.tasks[s.currentTaskIndex] ? `Aktuális: ${s.tasks[s.currentTaskIndex]}` : "Nincs aktív feladat";
            
            // Átlag kijelzés felfedés után
            if(s.revealed && s.taskResults[s.currentTaskIndex]) {
                const vals = s.taskResults[s.currentTaskIndex].filter(v => v && !isNaN(v));
                if(vals.length > 0) {
                    const avg = vals.reduce((a,b)=>a+parseInt(b),0)/vals.length;
                    document.getElementById('avg-display').innerText = `Átlag: ${avg.toFixed(1)}`;
                } else {
                    document.getElementById('avg-display').innerText = "Nincs numerikus szavazat";
                }
            } else { 
                document.getElementById('avg-display').innerText = ""; 
            }

            // Teljes előzmény lista az eddigi eredményekkel
            const list = document.getElementById('history-list'); 
            list.innerHTML = '';
            s.tasks.forEach((t, i) => {
                let resText = "";
                if(s.taskResults[i]) {
                    const vals = s.taskResults[i].filter(v => v && !isNaN(v));
                    if(vals.length > 0) {
                        const avg = (vals.reduce((a,b)=>a+parseInt(b),0)/vals.length).toFixed(1);
                        resText = ` (Átlag: ${avg})`;
                    }
                }
                const div = document.createElement('div');
                div.className = `task-item ${i === s.currentTaskIndex ? 'active' : ''}`;
                div.innerText = `${i+1}. ${t.trim()}${resText}`;
                list.appendChild(div);
            });
        });
    </script>
</body>
</html>
