<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrum Poker Compact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #0f172a; --table: #065f46; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .container { width: 95vw; max-width: 600px; height: 95vh; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        
        /* Minimalizált elemek */
        h1 { font-size: 18px; color: #818cf8; text-align: center; }
        .box { background: #1e293b; padding: 10px; border-radius: 10px; border: 1px solid #334155; }
        
        /* Asztal - rugalmas méret */
        .poker-table-container { flex-grow: 1; min-height: 150px; background: var(--table); border-radius: 50%; border: 4px solid #047857; position: relative; margin: 10px 0; display: flex; justify-content: center; align-items: center; }
        
        /* Kártyapakli alul - kompakt */
        .cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .poker-card { aspect-ratio: 4/5; border: 1px solid #334155; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; background: #111827; }
        
        button { padding: 8px; border-radius: 6px; border: none; background: var(--primary); color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        /* Pozíciók az asztalon - kisebbek */
        .player-seat { position: absolute; display: flex; flex-direction: column; align-items: center; font-size: 10px; }
        .seat-card { width: 22px; height: 30px; border-radius: 3px; }
        .player-name { background: rgba(0,0,0,0.5); padding: 1px 4px; border-radius: 3px; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Scrum Poker</h1>
        
        <div id="login-screen" class="box">
            <input type="text" id="username-input" placeholder="Neved..." style="width:100%; padding:8px; margin-bottom:5px;">
            <button id="login-btn" style="width:100%;">Belépés</button>
        </div>

        <div id="game-screen" style="display:none; display:flex; flex-direction:column; height: 100%;">
            <div id="sm-panel" class="box" style="display:none; padding:5px; font-size:12px;">
                <textarea id="tasks-input" rows="1" placeholder="Feladatok (soronként)..."></textarea>
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <button id="start-tasks-btn" style="flex:1;">Indítás</button>
                    <button id="reset-btn" style="background:#dc2626;">Reset</button>
                </div>
            </div>

            <div class="poker-table-container" id="poker-table">
                <div id="table-center-text" style="text-align:center; font-size:12px;">Várakozás...</div>
            </div>

            <div id="current-task-display" class="box" style="display:none; padding:10px;">
                <div id="task-title" style="font-size:13px; margin-bottom:8px;">-</div>
                <div class="cards-grid" id="cards-container"></div>
                <div style="display:flex; gap:5px; margin-top:8px;">
                    <button id="reveal-btn" style="flex:1; display:none; background:#059669;">Felfedés</button>
                    <button id="next-btn" style="flex:1; display:none;">Következő</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // (A korábbi logika itt változatlan marad...)
        const socket = io();
        document.getElementById('login-btn').addEventListener('click', () => {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return;
            socket.emit('join', name);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
        });

        // ... [Ide másold vissza a korábbi script-ből a kártya generálást és socket.on('state') részt] ...
    </script>
</body>
</html>
