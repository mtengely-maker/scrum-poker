<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker Pro</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --panel: #1e293b;
            --table: #065f46;
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 76px;
            padding: 0 24px;
            background: rgba(15, 23, 42, 0.96);
            border-bottom: 1px solid #334155;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 100;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .app-brand-text {
            min-width: 0;
        }

        .app-title {
            margin: 0;
            color: #f8fafc;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .app-subtitle {
            margin: 3px 0 0;
            color: #94a3b8;
            font-size: 11px;
            letter-spacing: 0.04em;
        }

        .app-header-badge {
            padding: 6px 10px;
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.1);
            color: #a5b4fc;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-logo {
            position: relative;
            width: 54px;
            height: 46px;
            flex-shrink: 0;
        }

        .brand-card {
            position: absolute;
            top: 5px;
            left: 16px;
            width: 27px;
            height: 37px;
            border: 2px solid #f8fafc;
            border-radius: 5px;
            background: #fffdf5;
            color: #312e81;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.35);
        }

        .brand-card-left {
            transform: translateX(-10px) rotate(-16deg);
            color: #b91c1c;
        }

        .brand-card-middle {
            z-index: 2;
            transform: translateY(-3px);
            color: #312e81;
        }

        .brand-card-right {
            transform: translateX(10px) rotate(16deg);
            color: #047857;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }

        .sidebar {
            width: 240px;
            margin-top: 76px;
            padding: 15px;
            height: calc(100vh - 76px);
            background: var(--panel);
            border-right: 1px solid #334155;
            overflow-y: auto;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .container {
            flex-grow: 1;
            margin-top: 76px;
            padding: 15px;
            height: calc(100vh - 76px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .controls {
    width: min(100%, 680px);
    padding: 12px 14px;
    box-sizing: border-box;

    background:
        linear-gradient(
            145deg,
            rgba(30, 41, 59, 0.98) 0%,
            rgba(15, 23, 42, 0.98) 100%
        );

    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 16px;

    text-align: left;

    box-shadow:
        0 12px 26px rgba(0, 0, 0, 0.27),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.facilitator-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: 9px;
}

.facilitator-panel-title {
    display: flex;
    align-items: center;
    gap: 8px;

    color: #f8fafc;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.02em;
}

.facilitator-panel-title-icon {
    width: 25px;
    height: 25px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    background: rgba(245, 158, 11, 0.13);
    border: 1px solid rgba(245, 158, 11, 0.28);
    border-radius: 8px;

    color: #fbbf24;
    font-size: 13px;
}

.facilitator-panel-hint {
    color: #64748b;
    font-size: 9px;
    font-weight: 600;
    white-space: nowrap;
}

.facilitator-panel-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: stretch;
    gap: 10px;
}

.task-input-group {
    min-width: 0;
}

.task-input-label {
    display: block;
    margin-bottom: 5px;

    color: #94a3b8;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.task-input {
    width: 100%;
    min-height: 66px;
    max-height: 110px;

    padding: 9px 11px;
    box-sizing: border-box;
    resize: vertical;

    background: rgba(2, 6, 23, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 10px;

    color: #f8fafc;
    font-family: inherit;
    font-size: 11px;
    line-height: 1.4;

    outline: none;

    transition:
        border-color 160ms ease,
        box-shadow 160ms ease,
        background 160ms ease;
}

.task-input::placeholder {
    color: #64748b;
}

.task-input:focus {
    background: rgba(2, 6, 23, 0.9);
    border-color: rgba(129, 140, 248, 0.72);

    box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

.facilitator-settings {
    width: 180px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 9px;
}

.deck-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.deck-field-label {
    color: #94a3b8;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.deck-select {
    width: 100%;
    padding: 8px 9px;
    box-sizing: border-box;

    background: rgba(2, 6, 23, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 9px;

    color: #f8fafc;
    font-size: 10px;
    font-weight: 700;

    outline: none;
    cursor: pointer;

    transition:
        border-color 160ms ease,
        box-shadow 160ms ease;
}

.deck-select:focus {
    border-color: rgba(129, 140, 248, 0.72);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.13);
}

.facilitator-actions {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 7px;
}

        .table-area {
    flex-grow: 1;
    position: relative;
    width: 100%;
    min-height: 200px;

    display: flex;
    justify-content: center;
    align-items: center;

    isolation: isolate;
}

        .table-shape {
    position: relative;
    width: 300px;
    height: 160px;
    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px 28px;
    box-sizing: border-box;
    text-align: center;

    background:
        radial-gradient(

            rgba(255, 255, 255, 0.08) 0%,

        ),

            125deg,
            rgba(255, 255, 255, 0.018) 0,
            rgba(255, 255, 255, 0.018) 2px,
            transparent 2px,
            transparent 6px
        ),
        linear-gradient(
            145deg,
            #087353 0%,
            #065f46 48%,
            #034c39 100%
        );

    border: 5px solid #8a5a2b;
    border-radius: 100px;

    box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.42),
        0 5px 10px rgba(0, 0, 0, 0.32),
        inset 0 0 0 3px #c08a4b,
        inset 0 0 0 6px rgba(41, 24, 12, 0.5),
        inset 0 0 34px rgba(0, 0, 0, 0.38);

    z-index: 1;
}

        .seat {
    position: absolute;
    z-index: 2;

    display: flex;
    flex-direction: column;
    align-items: center;

    min-width: 84px;

    transition:
        transform 300ms ease,
        opacity 200ms ease;
}

.avatar-container {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
}

.avatar {
    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-sizing: border-box;

    background:
        radial-gradient(
            circle at 35% 30%,
            rgba(255, 255, 255, 0.16),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #334155 0%,
            #1e293b 100%
        );

    border: 2px solid #818cf8;
    border-radius: 50%;

    color: #f8fafc;
    font-size: 21px;

    box-shadow:
        0 7px 14px rgba(0, 0, 0, 0.38),
        0 0 0 3px rgba(99, 102, 241, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.sm-badge {
    position: absolute;
    top: -7px;
    right: -10px;

    min-width: 22px;
    height: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-sizing: border-box;

    background:
        linear-gradient(
            145deg,
            #fef3c7 0%,
            #f59e0b 100%
        );

    border: 2px solid #fffbeb;
    border-radius: 50%;

    color: #78350f;
    font-size: 11px;
    font-weight: 900;

    box-shadow:
        0 5px 10px rgba(0, 0, 0, 0.38),
        0 0 0 2px rgba(245, 158, 11, 0.18);
}

.seat-name {
    max-width: 92px;
    margin-top: 5px;
    padding: 3px 8px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    background: rgba(15, 23, 42, 0.9);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 999px;

    color: #f1f5f9;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.2;

    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.24);
}

.player-status {
    min-width: 58px;
    margin-top: 3px;
    padding: 3px 7px;

    box-sizing: border-box;

    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 999px;

    color: #cbd5e1;
    font-size: 9px;
    font-weight: 700;
    line-height: 1.2;
    text-align: center;
    white-space: nowrap;

    box-shadow: 0 3px 7px rgba(0, 0, 0, 0.22);
}

.player-status-waiting {
    color: #cbd5e1;
    border-color: rgba(148, 163, 184, 0.26);
}

.player-status-voted {
    color: #6ee7b7;
    background: rgba(6, 78, 59, 0.82);
    border-color: rgba(52, 211, 153, 0.34);
}

.player-status-revealed {
    color: #312e81;
    background:
        linear-gradient(
            145deg,
            #fffef8 0%,
            #f4e8c9 100%
        );
    border-color: #d6ba76;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11px;
    font-weight: 900;
}

.player-status-facilitator {
    color: #fde68a;
    background: rgba(120, 53, 15, 0.78);
    border-color: rgba(245, 158, 11, 0.4);
}

        .cards-container {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: flex-start;
    gap: 6px;
    width: 100%;
    max-width: 900px;
    min-height: 108px;
    margin: 0 auto;
    padding: 14px 6px 4px;
    box-sizing: border-box;
    overflow: visible;
}

.card {
    --card-accent: #b91c1c;
    --card-accent-soft: rgba(185, 28, 28, 0.14);

    position: relative;
    width: 58px;
    height: 84px;
    flex: 0 0 auto;
    overflow: hidden;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            var(--card-accent-soft) 0,
            transparent 46%
        ),
        linear-gradient(
            145deg,
            #fffef8 0%,
            #f5ecd7 100%
        );

    color: #172033;
    border: 2px solid #e5d5ad;
    border-radius: 9px;
    box-shadow:
        0 7px 14px rgba(0, 0, 0, 0.38),
        inset 0 0 0 2px #fffdf5,
        inset 0 0 0 4px var(--card-accent-soft);

    cursor: pointer;
    user-select: none;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px;
    font-weight: 900;
    line-height: 1;

    transform:
    translateY(var(--card-offset-y, 0px))
    rotate(var(--card-rotation, 0deg));

transform-origin: center bottom;

    transition:
        transform 160ms ease,
        box-shadow 160ms ease,
        border-color 160ms ease,
        filter 160ms ease;
}

.card::before,
.card::after {
    content: attr(data-value);
    position: absolute;
    color: var(--card-accent);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 9px;
    font-weight: 900;
    line-height: 1;
}

.card::before {
    top: 7px;
    left: 7px;
}

.card::after {
    right: 7px;
    bottom: 7px;
    transform: rotate(180deg);
}

.card:hover {
    transform:
        translateY(calc(var(--card-offset-y, 0px) - 10px))
        rotate(0deg)
        scale(1.04);

    border-color: var(--card-accent);

    box-shadow:
        0 14px 22px rgba(0, 0, 0, 0.48),
        0 0 0 2px var(--card-accent-soft),
        inset 0 0 0 2px #fffdf5,
        inset 0 0 0 4px var(--card-accent-soft);

    z-index: 10;
}

.card.selected {
    transform:
        translateY(calc(var(--card-offset-y, 0px) - 14px))
        rotate(0deg)
        scale(1.07);

    border-color: #818cf8;

    box-shadow:
        0 16px 26px rgba(0, 0, 0, 0.55),
        0 0 0 3px rgba(99, 102, 241, 0.46),
        0 0 24px rgba(99, 102, 241, 0.5),
        inset 0 0 0 2px #fffdf5,
        inset 0 0 0 4px var(--card-accent-soft);

    z-index: 20;
}

.card.selected::before {
    content: "✓";
    color: #4f46e5;
    font-family: sans-serif;
    font-size: 11px;
}

.card-suit-red {
    --card-accent: #b91c1c;
    --card-accent-soft: rgba(185, 28, 28, 0.15);
}

.card-suit-green {
    --card-accent: #047857;
    --card-accent-soft: rgba(4, 120, 87, 0.15);
}

.card-suit-gold {
    --card-accent: #b45309;
    --card-accent-soft: rgba(180, 83, 9, 0.16);
}

.card-suit-blue {
    --card-accent: #4338ca;
    --card-accent-soft: rgba(67, 56, 202, 0.15);
}

.card-special-question {
    --card-accent: #7c3aed;
    --card-accent-soft: rgba(124, 58, 237, 0.17);
}

.card-special-coffee {
    --card-accent: #92400e;
    --card-accent-soft: rgba(146, 64, 14, 0.18);
}

        .btn {
    min-height: 34px;
    padding: 8px 14px;
    box-sizing: border-box;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    background:
        linear-gradient(
            145deg,
            #6366f1 0%,
            #4f46e5 100%
        );

    border: 1px solid rgba(165, 180, 252, 0.32);
    border-radius: 9px;

    color: #ffffff;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 6px 12px rgba(49, 46, 129, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);

    transition:
        transform 140ms ease,
        background 140ms ease,
        box-shadow 140ms ease,
        filter 140ms ease;
}

.btn:hover {
    background:
        linear-gradient(
            145deg,
            #4f46e5 0%,
            #4338ca 100%
        );

    transform: translateY(-1px);

    box-shadow:
        0 8px 16px rgba(49, 46, 129, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

.btn:active {
    transform: translateY(0);
}

.btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
}

.btn-danger {
    background: rgba(127, 29, 29, 0.72);
    border-color: rgba(251, 113, 133, 0.25);
    color: #fecdd3;

    box-shadow:
        0 5px 10px rgba(76, 5, 25, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.btn-danger:hover {
    background: rgba(159, 18, 57, 0.88);

    box-shadow:
        0 7px 14px rgba(76, 5, 25, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

        .task-item {
            padding: 6px 10px;
            margin-bottom: 6px;
            background: #334155;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .task-item:hover {
            background: #475569;
        }

        .task-item.active {
            border-left: 4px solid var(--primary);
            background: #1e293b;
        }
.table-shape::before {
    content: "";
    position: absolute;
    inset: 10px;

    border: 1px solid rgba(236, 253, 245, 0.16);
    border-radius: inherit;

    box-shadow:
        inset 0 0 18px rgba(255, 255, 255, 0.03),
        0 0 12px rgba(0, 0, 0, 0.12);

    pointer-events: none;
}

#task-title {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 230px;

    color: #ecfdf5;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;

    padding: 7px 12px;
    box-sizing: border-box;

    background: rgba(2, 44, 34, 0.46);
    border: 1px solid rgba(167, 243, 208, 0.18);
    border-radius: 10px;

    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);

        0 5px 12px rgba(0, 0, 0, 0.18),

    overflow: hidden;

}

#avg-display {
    position: relative;
    z-index: 2;

    width: 68px;
    height: 94px;
    min-width: 68px;
    min-height: 94px;
    flex: 0 0 auto;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0;
    padding: 0;
    box-sizing: border-box;

    color: #312e81;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    font-weight: 900;
    line-height: 1;

    background:
        radial-gradient(
            circle at center,
            rgba(67, 56, 202, 0.12) 0%,
            transparent 48%
        ),
        linear-gradient(
            145deg,
            #fffef8 0%,
            #f4e8c9 100%
        );

    border: 2px solid #d6ba76;
    border-radius: 9px;

    box-shadow:
        0 10px 20px rgba(0, 0, 0, 0.4),

}

#avg-display:empty {
    display: none;
}

#avg-display::before,
#avg-display::after {
    content: "◆";
    position: absolute;

    color: #b91c1c;
    font-size: 10px;
    line-height: 1;
}

#avg-display::before {
    top: 7px;
    left: 7px;
}

#avg-display::after {
    right: 7px;
    bottom: 7px;
    transform: rotate(180deg);
}

.table-shape.result-revealed #task-title {
    display: none;
}

.table-shape.result-revealed {
    padding-top: 12px;
    padding-bottom: 12px;
}

@media (min-width: 769px) {
    .cards-container {
        gap: 0;
        padding-left: 18px;
        padding-right: 18px;
    }

    .cards-container .card + .card {
        margin-left: -5px;
    }

    .cards-container.deck-fibonacci .card + .card {
        margin-left: -4px;
    }

    .cards-container.deck-extended .card + .card {
        margin-left: -8px;
    }

    .cards-container.deck-tshirt .card + .card {
        margin-left: -3px;
    }
}
        @media (min-width: 769px) and (max-width: 1180px) {
    .cards-container.deck-extended {
        gap: 2px;
        max-width: 100%;
        padding-left: 22px;
        padding-right: 22px;
    }

    .cards-container.deck-extended .card {
        width: 48px;
        height: 72px;
        font-size: 20px;
    }

    .cards-container.deck-extended .card::before,
    .cards-container.deck-extended .card::after {
        font-size: 8px;
    }
}
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100vh;
                overflow: hidden;
            }

            .app-header {
                height: 68px;
                padding: 0 14px;
            }

            .app-title {
                font-size: 16px;
            }

            .app-subtitle {
                display: none;
            }

            .app-header-badge {
                display: none;
            }

            .brand-logo {
                width: 48px;
                transform: scale(0.88);
                transform-origin: left center;
            }

            .sidebar {
                width: 100%;
                height: 130px;
                margin-top: 68px;
                border-right: none;
                border-bottom: 1px solid #334155;
                flex-shrink: 0;
            }

            .container {
                height: calc(100vh - 198px);
                margin-top: 0;
            }

            .controls {
    width: 100%;
    padding: 9px 10px;

<body>
    <header class="app-header">
        <div class="app-brand">

    </header>
    <div class="sidebar">

    <div class="container">
        <div id="login-screen" style="margin: auto; text-align: center; padding: 20px;">

                </label>

                <select id="role-select"
                    style="padding:10px; border-radius:6px; border:none; width:200px; box-sizing:border-box; background:#334155; color:white;">
                    <option value="player" selected>Játékos</option>
                    <option value="facilitator">Játékvezető</option>

            <div id="login-error"
                style="display:none; max-width:300px; margin:0 auto 12px; padding:8px 10px; border-radius:6px; background:#7f1d1d; color:#fecaca; font-size:12px;">
            </div>

        <div id="game-screen"
            style="display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:space-between;">
            <div id="sm-panel" class="controls" style="display:none;">
    <div class="facilitator-panel-header">
        <div class="facilitator-panel-title">
            <span class="facilitator-panel-title-icon">★</span>
            <span>Játékvezetői panel</span>
        </div>

        <div class="facilitator-panel-hint">
            Egy feladat soronként
        </div>
    </div>

    <div class="facilitator-panel-body">
        <div class="task-input-group">
            <label class="task-input-label" for="tasks">
                Becslendő feladatok
            </label>

            <textarea
                id="tasks"
                class="task-input"
                rows="2"
                placeholder="Például:&#10;Bejelentkezési folyamat fejlesztése&#10;Riport export kialakítása"
            ></textarea>
        </div>

        <div class="facilitator-settings">
            <div class="deck-field">
                <label class="deck-field-label" for="deck-select">

                </label>

                <select id="deck-select" class="deck-select">
                    <option value="fibonacci">

            <div class="table-area" id="table-area">
    <div class="table-shape">
        <div id="task-title">
            Várakozás...
        </div>

        <div id="avg-display"></div>

            <div
                style="width:100%; text-align:center; background: var(--panel); padding: 10px; border-radius: 10px; margin-top: 10px;">
                <!-- Ha SM vagyunk, elrejtjük a kártyákat, hiszen ő nem szavaz -->
                <div id="cards-wrapper">
                    <div id="cards" class="cards-container" style="margin-bottom: 8px;"></div>
                </div>
                <div id="sm-controls" style="display:none; justify-content:center; gap:10px;">
                    <button class="btn" onclick="socket.emit('reveal')" style="background:#059669;">Felfedés</button>
                    <button class="btn" onclick="socket.emit('nextTask')">Következő ➡</button>
                </div>
            </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const decks = {
            fibonacci: ['1', '2', '3', '5', '8', '13', '21', '?', '☕'],
            extended: ['0', '0.5', '1', '2', '3', '5', '8', '13', '20', '40', '100', '?', '☕'],
            tshirt: ['XS', 'S', 'M', 'L', 'XL', 'XXL', '?', '☕']
        };

        function join() {
            const nameInput = document.getElementById('username');
            const roleSelect = document.getElementById('role-select');
            const joinButton = document.getElementById('join-button');
            const loginError = document.getElementById('login-error');

            const name = nameInput.value.trim();
            const role = roleSelect.value === 'facilitator'
                ? 'facilitator'
                : 'player';

            loginError.style.display = 'none';
            loginError.innerText = '';

            if (!name) {
                loginError.innerText = 'Add meg a nevedet!';
                loginError.style.display = 'block';
                nameInput.focus();
                return;
            }

            joinButton.disabled = true;
            joinButton.innerText = 'Belépés...';

            socket.emit('join', {
                name,
                role
            });
        }

        socket.on('joinSuccess', ({player}) => {
            const joinButton = document.getElementById('join-button');
            const roleSelect = document.getElementById('role-select');
            const loginError = document.getElementById('login-error');

            joinButton.disabled = false;
            joinButton.innerText = 'Belépés';

            loginError.style.display = 'none';
            loginError.innerText = '';

            localStorage.setItem(
                'scrumPokerLastRole',
                player.role || roleSelect.value || 'player'
            );

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
        });
        function start() {
            const tasksText = document.getElementById('tasks').value;
            const deckType = document.getElementById('deck-select').value;
            if (tasksText) socket.emit('addTasks', {tasks: tasksText.split('\n'), deckType});
        }
        function resetGame() {
            socket.emit('resetGame');

            document.getElementById('tasks').value = '';
            document.getElementById('avg-display').innerText = '';

            document
                .querySelectorAll('.card')
                .forEach(card => card.classList.remove('selected'));
        }

        socket.on('joinError', ({message}) => {
            const joinButton = document.getElementById('join-button');
            const loginError = document.getElementById('login-error');

            joinButton.disabled = false;
            joinButton.innerText = 'Belépés';

            loginError.innerText =
                message || 'A belépés nem sikerült.';

            loginError.style.display = 'block';
        });

        socket.on('actionError', ({message}) => {
            alert(message || 'A művelet nem hajtható végre.');
        });

        socket.on('roleChangeError', ({message}) => {
            alert(message || 'A szerepkör módosítása nem sikerült.');
        });

        function renderCards(deckType, selectedVote = null) {
    const container = document.getElementById('cards');
    container.innerHTML = '';

    container.classList.remove(
    'deck-fibonacci',
    'deck-extended',
    'deck-tshirt'
);

const activeDeckType = decks[deckType]
    ? deckType
    : 'fibonacci';

container.classList.add(`deck-${activeDeckType}`);

    const deck = decks[deckType] || decks.fibonacci;

    const suitClasses = [
        'card-suit-red',
        'card-suit-green',
        'card-suit-gold',
        'card-suit-blue'
    ];

    const cardCount = deck.length;
    const centerIndex = (cardCount - 1) / 2;
let selectedCardElement = null;

    let maximumRotation;
    let maximumOffset;

    if (deckType === 'extended') {
        maximumRotation = 6;
        maximumOffset = 9;
    } else if (deckType === 'tshirt') {
        maximumRotation = 7;
        maximumOffset = 11;
    } else {
        // Alapértelmezett: Fibonacci
        maximumRotation = 8;
        maximumOffset = 12;
    }

    deck.forEach((value, index) => {
        const card = document.createElement('div');

        let cardStyleClass =
            suitClasses[index % suitClasses.length];

        if (value === '?') {
            cardStyleClass = 'card-special-question';
        }

        if (value === '☕') {
            cardStyleClass = 'card-special-coffee';
        }

        const normalizedPosition =
            centerIndex === 0
                ? 0
                : (index - centerIndex) / centerIndex;

        const rotation =
            normalizedPosition * maximumRotation;

        const offsetY =
            Math.pow(Math.abs(normalizedPosition), 1.7) *
            maximumOffset;

        const isSelected =
    selectedVote !== null &&
    selectedVote !== undefined &&
    String(selectedVote) === String(value);

card.className =
    `card ${cardStyleClass}${isSelected ? ' selected' : ''}`;

    if (isSelected) {
    selectedCardElement = card;
}
        card.innerText = value;
        card.dataset.value = value;
        card.title = `${value} becslés`;

        card.style.setProperty(
            '--card-rotation',
            `${rotation.toFixed(2)}deg`
        );

        card.style.setProperty(
            '--card-offset-y',
            `${offsetY.toFixed(2)}px`
        );

        card.onclick = () => {
            document
                .querySelectorAll('.card')
                .forEach(item => {
                    item.classList.remove('selected');
                });

            card.classList.add('selected');

if (window.matchMedia('(max-width: 768px)').matches) {
    card.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
        inline: 'center'
    });
}

socket.emit('vote', value);
        };

        container.appendChild(card);
    });
    if (
    selectedCardElement &&
    window.matchMedia('(max-width: 768px)').matches
) {
    requestAnimationFrame(() => {
        selectedCardElement.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest',
            inline: 'center'
        });
    });
}
}

        function getClosestValue(vals, deckType) {
            const deck = decks[deckType] || decks.fibonacci;
            const numericDeck = deck.map(v => parseFloat(v)).filter(v => !isNaN(v));

            if (numericDeck.length === 0) {
                const counts = {};
                vals.forEach(v => counts[v] = (counts[v] || 0) + 1);
                let maxVal = vals[0];
                let maxCount = 0;
                for (let v in counts) {
                    if (counts[v] > maxCount) {
                        maxCount = counts[v];
                        maxVal = v;
                    }
                }
                return maxVal;
            }

            const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
            let closest = numericDeck[0];
            let minDiff = Math.abs(avg - closest);
            for (let i = 1; i < numericDeck.length; i++) {
                let diff = Math.abs(avg - numericDeck[i]);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = numericDeck[i];
                }
            }
            return closest;
        }

        socket.on('state', (s) => {
            const isSM = s.players[socket.id]?.isSM;
            const selectedVote = s.players[socket.id]?.vote ?? null;

            document.getElementById('sm-panel').style.display = isSM ? 'block' : 'none';
            document.getElementById('sm-controls').style.display = isSM ? 'flex' : 'none';

            // Scrum Master elől elrejtjük a szavazókártyákat is
            document.getElementById('cards-wrapper').style.display = isSM ? 'none' : 'block';
            
            renderCards(
    s.cardDeckType || 'fibonacci',
    selectedVote
);
            const taskTitleElement =
    document.getElementById('task-title');

const averageDisplayElement =
    document.getElementById('avg-display');

const tableShapeElement =
    document.querySelector('.table-shape');

const hasRevealedResult =
    Boolean(s.revealed) &&
    Array.isArray(s.taskResults[s.currentTaskIndex]);

taskTitleElement.innerText =
    s.tasks[s.currentTaskIndex]
        ? s.tasks[s.currentTaskIndex]
        : 'Nincs aktív feladat';

tableShapeElement.classList.toggle(
    'result-revealed',
    hasRevealedResult
);

if (hasRevealedResult) {
                const rawVotes = s.taskResults[s.currentTaskIndex].filter(v => v !== null && v !== undefined);
                const numericVals = rawVotes.filter(v => !isNaN(v)).map(v => parseFloat(v));

                if (numericVals.length > 0) {
                    const recommended = getClosestValue(numericVals, s.cardDeckType);
                    averageDisplayElement.innerText = recommended;
                } else if (rawVotes.length > 0) {
                    const recommended = getClosestValue(rawVotes, s.cardDeckType);
                    averageDisplayElement.innerText = recommended;
                } else {
                    averageDisplayElement.innerText = '-';
                }
            } else {
                averageDisplayElement.innerText = '';
            }

            const tableArea = document.getElementById('table-area');
            document.querySelectorAll('.seat').forEach(el => el.remove());

            const players = Object.values(s.players);
            players.forEach((p, i) => {
                const angle = (i / players.length) * 2 * Math.PI - Math.PI / 2;
                const radiusX = 130;
                const radiusY = 75;
                const x = Math.cos(angle) * radiusX;
                const y = Math.sin(angle) * radiusY;

                // Ha Scrum Master, akkor nem szavaz, hanem bírói síp jelzést kap (🏴 vagy 🟨) státusz helyett
                let statusText = 'Várakozik';
let statusClass = 'player-status-waiting';

if (p.isSM) {
    statusText = 'Játékvezető';
    statusClass = 'player-status-facilitator';
} else if (s.revealed && p.vote) {
    statusText = p.vote;
    statusClass = 'player-status-revealed';
} else if (p.vote) {
    statusText = 'Szavazott';
    statusClass = 'player-status-voted';
}

                // Bírói síp / jelvény az avatar sarkában az SM-nek
                const smBadgeHtml = p.isSM
    ? '<div class="sm-badge" title="Játékvezető">★</div>'
    : '';

                const seat = document.createElement('div');
                seat.className = 'seat';
                seat.style.transform = `translate(${x}px, ${y}px)`;
                seat.innerHTML = `
                    <div class="avatar-container">
                        <div class="avatar" title="${p.name}">${p.emoji || '👤'}</div>
                        ${smBadgeHtml}
                    </div>
                    <div class="seat-name">${p.name}</div>
                    <div class="player-status ${statusClass}">
    ${statusText}
</div>
                `;
                tableArea.appendChild(seat);
            });

            const list = document.getElementById('history-list');
            list.innerHTML = '';
            s.tasks.forEach((t, i) => {
                let resText = "";
                if (s.taskResults[i]) {
                    const rawVotes = s.taskResults[i].filter(v => v !== null && v !== undefined);
                    const numericVals = rawVotes.filter(v => !isNaN(v)).map(v => parseFloat(v));

                    if (numericVals.length > 0) {
                        const rec = getClosestValue(numericVals, s.cardDeckType);
                        resText = ` [${rec}]`;
                    } else if (rawVotes.length > 0) {
                        const rec = getClosestValue(rawVotes, s.cardDeckType);
                        resText = ` [${rec}]`;
                    }
                }
                const div = document.createElement('div');
                div.className = `task-item ${i === s.currentTaskIndex ? 'active' : ''}`;
                div.innerText = `${i + 1}. ${t.trim()}${resText}`;
                div.onclick = () => {
                    if (isSM) socket.emit('goToTask', i);
                };
                list.appendChild(div);
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedRole =
                localStorage.getItem('scrumPokerLastRole');

            const roleSelect =
                document.getElementById('role-select');

            if (
                savedRole === 'player' ||
                savedRole === 'facilitator'
            ) {
                roleSelect.value = savedRole;
            }

            document
                .getElementById('username')
                .addEventListener('keydown', event => {
                    if (event.key === 'Enter') {
                        join();
                    }
                });
        });
    </script>
